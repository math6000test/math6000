<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Хаалттай илэрхийлэл— Сорил 6</title>

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #0f2b46;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .butsah {
        align-self: flex-start;
        padding: 18px 30px;
        color: #b8c7d9;
        text-decoration: none;
      }

      .kart {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 480px;
        padding: 30px;
        margin-bottom: 50px;
        text-align: center;
      }

      .toolur {
        color: #5a6b85;
        font-size: 15px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 26px;
        color: #0f2b46;
        margin: 0 0 24px;
      }

      button.songolt {
        display: block;
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        font-size: 19px;
        font-family: inherit;
        border: 2px solid #d6e0ec;
        border-radius: 10px;
        background: white;
        color: #0f2b46;
        cursor: pointer;
      }

      button.songolt:hover {
        border-color: #2563eb;
      }

      button.songolt.zov-haruulah {
        background: #dcfce7;
        border-color: #16a34a;
        color: #14532d;
      }

      button.songolt.buruu-haruulah {
        background: #fee2e2;
        border-color: #dc2626;
        color: #7f1d1d;
      }

      #bodolt {
        display: none;
        margin-top: 18px;
        padding: 16px;
        border-radius: 10px;
        background: #eff6ff;
        color: #0f2b46;
        font-size: 16px;
        line-height: 1.6;
        text-align: left;
      }

      #daraah {
        display: none;
        margin-top: 18px;
        padding: 13px 36px;
        font-size: 17px;
        font-family: inherit;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      .dun-mur {
        text-align: left;
        padding: 10px 0;
        border-bottom: 1px solid #eef2f7;
        color: #0f2b46;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <a class="butsah" href="aravt-jagsaalt.html">← Сорилууд руу буцах</a>

    <div class="kart">
      <p class="toolur" id="toolur"></p>
      <h1 id="asuult"></h1>
      <div id="songoltuud"></div>
      <div id="bodolt"></div>
      <button id="daraah" onclick="daraagiinh()">Дараах →</button>
    </div>

    <script>
          var bodloguud = [
        {
          asuult: "\\( 5.603 - (19.22 - 14.307) = ? \\)",
          songoltuud: ["\\( 0.69 \\)", "\\( 0.79 \\)", "\\( 10.69 \\)"],
          zov: "\\( 0.69 \\)",
          bodolt: "Хаалт: \\( 19.22 - 14.307 = 4.913 \\). Тэгээд \\( 5.603 - 4.913 = 0.69 \\)."
        },
        {
          asuult: "\\( 94.067 - (22.6 - 1.008) = ? \\)",
          songoltuud: ["\\( 72.475 \\)", "\\( 70.459 \\)", "\\( 72.567 \\)"],
          zov: "\\( 72.475 \\)",
          bodolt: "Хаалт: \\( 22.6 - 1.008 = 21.592 \\). Тэгээд \\( 94.067 - 21.592 = 72.475 \\)."
        },
        {
          asuult: "\\( 24.68 + (1.9 - 0.075) = ? \\)",
          songoltuud: ["\\( 26.505 \\)", "\\( 26.455 \\)", "\\( 26.605 \\)"],
          zov: "\\( 26.505 \\)",
          bodolt: "Хаалт: \\( 1.9 - 0.075 = 1.825 \\). Тэгээд \\( 24.68 + 1.825 = 26.505 \\)."
        },
        {
          asuult: "\\( 32.05 - (5.69 + 5.002) + 3.402 = ? \\)",
          songoltuud: ["\\( 24.76 \\)", "\\( 24.66 \\)", "\\( 25.76 \\)"],
          zov: "\\( 24.76 \\)",
          bodolt: "Хаалт: \\( 5.69 + 5.002 = 10.692 \\). Тэгээд \\( 32.05 - 10.692 + 3.402 = 24.76 \\)."
        },
        {
          asuult: "\\( 5.0084 + (9.032 - 6.9) - 7.14 = ? \\)",
          songoltuud: ["\\( 0.0004 \\)", "\\( 0.004 \\)", "\\( 0.04 \\)"],
          zov: "\\( 0.0004 \\)",
          bodolt: "Хаалт: \\( 9.032 - 6.9 = 2.132 \\). Тэгээд \\( 5.0084 + 2.132 - 7.14 = 0.0004 \\)."
        }
      ];
      var odoo = 0;
      var onoo = 0;
      var aldsan = [];
      var hariulsan = false;

      function tomyoZur() {
        if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise(); }
      }

      function haruul() {
        var b = bodloguud[odoo];
        hariulsan = false;

        document.getElementById("toolur").textContent =
          "Бодлого " + (odoo + 1) + " / " + bodloguud.length + "  ·  Оноо: " + onoo;
        document.getElementById("asuult").textContent = b.asuult;
        document.getElementById("bodolt").style.display = "none";
        document.getElementById("daraah").style.display = "none";

        var talbar = document.getElementById("songoltuud");
        talbar.innerHTML = "";

        for (var i = 0; i < b.songoltuud.length; i++) {
          var tovch = document.createElement("button");
          tovch.className = "songolt";
          tovch.textContent = b.songoltuud[i];
          tovch.setAttribute("data-hariu", b.songoltuud[i]);
          tovch.onclick = shalgah(b.songoltuud[i], b, tovch);
          talbar.appendChild(tovch);
        }

        tomyoZur();
      }

      function shalgah(songoson, b, tovch) {
        return function () {
          if (hariulsan) return;
          hariulsan = true;

          var buhTovch = document.getElementsByClassName("songolt");
          for (var i = 0; i < buhTovch.length; i++) {
            if (buhTovch[i].getAttribute("data-hariu") === String(b.zov)) {
              buhTovch[i].className = "songolt zov-haruulah";
            }
          }

          if (songoson === b.zov) {
            onoo = onoo + 1;
          } else {
            tovch.className = "songolt buruu-haruulah";
            aldsan.push(b);
            var bodoltTalbar = document.getElementById("bodolt");
            bodoltTalbar.innerHTML = "<b>Бодолт:</b> " + b.bodolt;
            bodoltTalbar.style.display = "block";
          }

          document.getElementById("toolur").textContent =
            "Бодлого " + (odoo + 1) + " / " + bodloguud.length + "  ·  Оноо: " + onoo;
          document.getElementById("daraah").style.display = "inline-block";

          tomyoZur();
        };
      }

      function daraagiinh() {
        odoo = odoo + 1;
        if (odoo < bodloguud.length) {
          haruul();
        } else {
          duusgah();
        }
      }

      function duusgah() {
        document.getElementById("toolur").textContent = "Сорил дууслаа";
        document.getElementById("asuult").textContent =
          "Таны оноо: " + onoo + " / " + bodloguud.length;
        document.getElementById("bodolt").style.display = "none";
        document.getElementById("daraah").style.display = "none";

        var talbar = document.getElementById("songoltuud");
        talbar.innerHTML = "";

        if (aldsan.length > 0) {
          for (var i = 0; i < aldsan.length; i++) {
            var mur = document.createElement("div");
            mur.className = "dun-mur";
            mur.innerHTML =
              "❌ <b>" + aldsan[i].asuult + "</b><br>Зөв хариу: " +
              aldsan[i].zov + "<br><small>" + aldsan[i].bodolt + "</small>";
            talbar.appendChild(mur);
          }
        } else {
          talbar.innerHTML = "<p style='color:#16a34a;font-weight:bold;font-size:20px'>🎉 Бүгдийг зөв бодлоо!</p>";
        }

        tomyoZur();
      }

      haruul();
    </script>
  </body>
</html>
