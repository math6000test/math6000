<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Энгийн бутархай — Сорил 2</title>

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #0f2b46;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .butsah {
        align-self: flex-start;
        padding: 18px 30px;
        color: #b8c7d9;
        text-decoration: none;
      }

      .kart {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 480px;
        padding: 30px;
        margin-bottom: 50px;
        text-align: center;
      }

      .toolur {
        color: #5a6b85;
        font-size: 15px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 26px;
        color: #0f2b46;
        margin: 0 0 24px;
      }

      button.songolt {
        display: block;
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        font-size: 19px;
        font-family: inherit;
        border: 2px solid #d6e0ec;
        border-radius: 10px;
        background: white;
        color: #0f2b46;
        cursor: pointer;
      }

      button.songolt:hover {
        border-color: #2563eb;
      }

      button.songolt.zov-haruulah {
        background: #dcfce7;
        border-color: #16a34a;
        color: #14532d;
      }

      button.songolt.buruu-haruulah {
        background: #fee2e2;
        border-color: #dc2626;
        color: #7f1d1d;
      }

      #bodolt {
        display: none;
        margin-top: 18px;
        padding: 16px;
        border-radius: 10px;
        background: #eff6ff;
        color: #0f2b46;
        font-size: 16px;
        line-height: 1.6;
        text-align: left;
      }

      #daraah {
        display: none;
        margin-top: 18px;
        padding: 13px 36px;
        font-size: 17px;
        font-family: inherit;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      .dun-mur {
        text-align: left;
        padding: 10px 0;
        border-bottom: 1px solid #eef2f7;
        color: #0f2b46;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <a class="butsah" href="butarhai-jagsaalt.html">← Сорилууд руу буцах</a>

    <div class="kart">
      <p class="toolur" id="toolur"></p>
      <h1 id="asuult"></h1>
      <div id="songoltuud"></div>
      <div id="bodolt"></div>
      <button id="daraah" onclick="daraagiinh()">Дараах →</button>
    </div>

    <script>
      var bodloguud = [
        {
          asuult: "\\( 1\\frac{1}{2} + \\frac{3}{4} = ? \\)",
          songoltuud: ["\\( 2\\frac{1}{4} \\)", "\\( 1\\frac{3}{4} \\)", "\\( 2\\frac{1}{2} \\)"],
          zov: "\\( 2\\frac{1}{4} \\)",
          bodolt: "Холимог тоог хувиргана: \\( 1\\frac{1}{2} = \\frac{3}{2} = \\frac{6}{4} \\). Тэгэхээр \\( \\frac{6}{4} + \\frac{3}{4} = \\frac{9}{4} = 2\\frac{1}{4} \\)."
        },
        {
          asuult: "\\( \\frac{1}{2} + \\frac{1}{3} + \\frac{1}{6} = ? \\)",
          songoltuud: ["\\( 1 \\)", "\\( \\frac{3}{11} \\)", "\\( \\frac{5}{6} \\)"],
          zov: "\\( 1 \\)",
          bodolt: "Ерөнхий хуваарь 6: \\( \\frac{3}{6} + \\frac{2}{6} + \\frac{1}{6} = \\frac{6}{6} = 1 \\)."
        },
        {
          asuult: "\\( 2\\frac{1}{3} \\times \\frac{3}{7} = ? \\)",
          songoltuud: ["\\( 1 \\)", "\\( \\frac{6}{7} \\)", "\\( \\frac{7}{9} \\)"],
          zov: "\\( 1 \\)",
          bodolt: "\\( 2\\frac{1}{3} = \\frac{7}{3} \\). Тэгэхээр \\( \\frac{7}{3} \\times \\frac{3}{7} = \\frac{21}{21} = 1 \\)."
        },
        {
          asuult: "\\( \\left( \\frac{2}{3} + \\frac{1}{6} \\right) \\div \\frac{5}{2} = ? \\)",
          songoltuud: ["\\( \\frac{1}{3} \\)", "\\( \\frac{5}{6} \\)", "\\( \\frac{25}{12} \\)"],
          zov: "\\( \\frac{1}{3} \\)",
          bodolt: "Эхлээд хаалт: \\( \\frac{4}{6} + \\frac{1}{6} = \\frac{5}{6} \\). Дараа нь \\( \\frac{5}{6} \\div \\frac{5}{2} = \\frac{5}{6} \\times \\frac{2}{5} = \\frac{10}{30} = \\frac{1}{3} \\)."
        },
        {
          asuult: "\\( \\frac{3}{4} \\)-ээс \\( \\frac{2}{3} \\) нь хэдээр их вэ?",
          songoltuud: ["\\( \\frac{1}{12} \\)", "\\( \\frac{1}{7} \\)", "\\( \\frac{5}{12} \\)"],
          zov: "\\( \\frac{1}{12} \\)",
          bodolt: "Ялгаврыг олно: \\( \\frac{3}{4} - \\frac{2}{3} = \\frac{9}{12} - \\frac{8}{12} = \\frac{1}{12} \\)."
        }
      ];

      var odoo = 0;
      var onoo = 0;
      var aldsan = [];
      var hariulsan = false;

      function tomyoZur() {
        if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise(); }
      }

      function haruul() {
        var b = bodloguud[odoo];
        hariulsan = false;

        document.getElementById("toolur").textContent =
          "Бодлого " + (odoo + 1) + " / " + bodloguud.length + "  ·  Оноо: " + onoo;
        document.getElementById("asuult").textContent = b.asuult;
        document.getElementById("bodolt").style.display = "none";
        document.getElementById("daraah").style.display = "none";

        var talbar = document.getElementById("songoltuud");
        talbar.innerHTML = "";

        for (var i = 0; i < b.songoltuud.length; i++) {
          var tovch = document.createElement("button");
          tovch.className = "songolt";
          tovch.textContent = b.songoltuud[i];
          tovch.setAttribute("data-hariu", b.songoltuud[i]);
          tovch.onclick = shalgah(b.songoltuud[i], b, tovch);
          talbar.appendChild(tovch);
        }

        tomyoZur();
      }

      function shalgah(songoson, b, tovch) {
        return function () {
          if (hariulsan) return;
          hariulsan = true;

          var buhTovch = document.getElementsByClassName("songolt");
          for (var i = 0; i < buhTovch.length; i++) {
            if (buhTovch[i].getAttribute("data-hariu") === String(b.zov)) {
              buhTovch[i].className = "songolt zov-haruulah";
            }
          }

          if (songoson === b.zov) {
            onoo = onoo + 1;
          } else {
            tovch.className = "songolt buruu-haruulah";
            aldsan.push(b);
            var bodoltTalbar = document.getElementById("bodolt");
            bodoltTalbar.innerHTML = "<b>Бодолт:</b> " + b.bodolt;
            bodoltTalbar.style.display = "block";
          }

          document.getElementById("toolur").textContent =
            "Бодлого " + (odoo + 1) + " / " + bodloguud.length + "  ·  Оноо: " + onoo;
          document.getElementById("daraah").style.display = "inline-block";

          tomyoZur();
        };
      }

      function daraagiinh() {
        odoo = odoo + 1;
        if (odoo < bodloguud.length) {
          haruul();
        } else {
          duusgah();
        }
      }

      function duusgah() {
        document.getElementById("toolur").textContent = "Сорил дууслаа";
        document.getElementById("asuult").textContent =
          "Таны оноо: " + onoo + " / " + bodloguud.length;
        document.getElementById("bodolt").style.display = "none";
        document.getElementById("daraah").style.display = "none";

        var talbar = document.getElementById("songoltuud");
        talbar.innerHTML = "";

        if (aldsan.length > 0) {
          for (var i = 0; i < aldsan.length; i++) {
            var mur = document.createElement("div");
            mur.className = "dun-mur";
            mur.innerHTML =
              "❌ <b>" + aldsan[i].asuult + "</b><br>Зөв хариу: " +
              aldsan[i].zov + "<br><small>" + aldsan[i].bodolt + "</small>";
            talbar.appendChild(mur);
          }
        } else {
          talbar.innerHTML = "<p style='color:#16a34a;font-weight:bold;font-size:20px'>🎉 Бүгдийг зөв бодлоо!</p>";
        }

        tomyoZur();
      }

      haruul();
    </script>
  </body>
</html>
