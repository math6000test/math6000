<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Энгийн бутархай — Сорил</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #1e2530;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .butsah {
        align-self: flex-start;
        padding: 18px 30px;
        color: #aab4c4;
        text-decoration: none;
      }

      .kart {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 480px;
        padding: 30px;
        margin-bottom: 50px;
        text-align: center;
      }

      .toolur {
        color: #5a6b85;
        font-size: 15px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 26px;
        color: #1a2b4a;
        margin: 0 0 24px;
      }

      button.songolt {
        display: block;
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        font-size: 19px;
        font-family: inherit;
        border: 2px solid #d6e0ec;
        border-radius: 10px;
        background: white;
        color: #1a2b4a;
        cursor: pointer;
      }

      button.songolt:hover {
        border-color: #2563eb;
      }

      button.songolt.zov-haruulah {
        background: #dcfce7;
        border-color: #16a34a;
        color: #14532d;
      }

      button.songolt.buruu-haruulah {
        background: #fee2e2;
        border-color: #dc2626;
        color: #7f1d1d;
      }

      #bodolt {
        display: none;
        margin-top: 18px;
        padding: 16px;
        border-radius: 10px;
        background: #eff6ff;
        color: #1a2b4a;
        font-size: 16px;
        line-height: 1.6;
        text-align: left;
      }

      #daraah {
        display: none;
        margin-top: 18px;
        padding: 13px 36px;
        font-size: 17px;
        font-family: inherit;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      .dun-mur {
        text-align: left;
        padding: 10px 0;
        border-bottom: 1px solid #eef2f7;
        color: #1a2b4a;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <a class="butsah" href="soril.html">← Сорилууд руу буцах</a>

    <div class="kart">
      <p class="toolur" id="toolur"></p>
      <h1 id="asuult"></h1>
      <div id="songoltuud"></div>
      <div id="bodolt"></div>
      <button id="daraah" onclick="daraagiinh()">Дараах →</button>
    </div>

    <script>
      var bodloguud = [
        {
          asuult: "1/2 + 1/4 = ?",
          songoltuud: ["2/6", "3/4", "1/6"],
          zov: "3/4",
          bodolt: "Хуваарийг тэнцүүлнэ: 1/2 = 2/4. Тэгэхээр 2/4 + 1/4 = 3/4."
        },
        {
          asuult: "3/5 − 1/5 = ?",
          songoltuud: ["2/5", "2/10", "4/5"],
          zov: "2/5",
          bodolt: "Хуваарь ижил тул хүртвэрийг хасна: 3 − 1 = 2. Хариу: 2/5."
        },
        {
          asuult: "2/3 × 3/4 = ?",
          songoltuud: ["6/7", "1/2", "5/12"],
          zov: "1/2",
          bodolt: "Хүртвэрийг хооронд нь, хуваарийг хооронд нь үржүүлнэ: (2×3)/(3×4) = 6/12 = 1/2."
        },
        {
          asuult: "1/2 ÷ 1/4 = ?",
          songoltuud: ["1/8", "2", "1/2"],
          zov: "2",
          bodolt: "Хуваахдаа урвуулж үржүүлнэ: 1/2 × 4/1 = 4/2 = 2."
        },
        {
          asuult: "Аль нь 6/8-тай тэнцүү вэ?",
          songoltuud: ["3/4", "2/3", "4/6"],
          zov: "3/4",
          bodolt: "6/8-ыг 2-т хураана: 6÷2 = 3, 8÷2 = 4. Тэгэхээр 6/8 = 3/4."
        }
      ];

      var odoo = 0;
      var onoo = 0;
      var aldsan = [];
      var hariulsan = false;

      function haruul() {
        var b = bodloguud[odoo];
        hariulsan = false;

        document.getElementById("toolur").textContent =
          "Бодлого " + (odoo + 1) + " / " + bodloguud.length + "  ·  Оноо: " + onoo;
        document.getElementById("asuult").textContent = b.asuult;
        document.getElementById("bodolt").style.display = "none";
        document.getElementById("daraah").style.display = "none";

        var talbar = document.getElementById("songoltuud");
        talbar.innerHTML = "";

        for (var i = 0; i < b.songoltuud.length; i++) {
          var tovch = document.createElement("button");
          tovch.className = "songolt";
          tovch.textContent = b.songoltuud[i];
          tovch.onclick = shalgah(b.songoltuud[i], b, tovch);
          talbar.appendChild(tovch);
        }
      }

      function shalgah(songoson, b, tovch) {
        return function () {
          if (hariulsan) return;
          hariulsan = true;

          var buhTovch = document.getElementsByClassName("songolt");
          for (var i = 0; i < buhTovch.length; i++) {
            if (buhTovch[i].textContent === String(b.zov)) {
              buhTovch[i].className = "songolt zov-haruulah";
            }
          }

          if (songoson === b.zov) {
            onoo = onoo + 1;
          } else {
            tovch.className = "songolt buruu-haruulah";
            aldsan.push(b);
            var bodoltTalbar = document.getElementById("bodolt");
            bodoltTalbar.innerHTML = "<b>Бодолт:</b> " + b.bodolt;
            bodoltTalbar.style.display = "block";
          }

          document.getElementById("toolur").textContent =
            "Бодлого " + (odoo + 1) + " / " + bodloguud.length + "  ·  Оноо: " + onoo;
          document.getElementById("daraah").style.display = "inline-block";
        };
      }

      function daraagiinh() {
        odoo = odoo + 1;
        if (odoo < bodloguud.length) {
          haruul();
        } else {
          duusgah();
        }
      }

      function duusgah() {
        document.getElementById("toolur").textContent = "Сорил дууслаа";
        document.getElementById("asuult").textContent =
          "Таны оноо: " + onoo + " / " + bodloguud.length;
        document.getElementById("bodolt").style.display = "none";
        document.getElementById("daraah").style.display = "none";

        var talbar = document.getElementById("songoltuud");
        talbar.innerHTML = "";

        if (aldsan.length > 0) {
          for (var i = 0; i < aldsan.length; i++) {
            var mur = document.createElement("div");
            mur.className = "dun-mur";
            mur.innerHTML =
              "❌ <b>" + aldsan[i].asuult + "</b><br>Зөв хариу: " +
              aldsan[i].zov + "<br><small>" + aldsan[i].bodolt + "</small>";
            talbar.appendChild(mur);
          }
        } else {
          talbar.innerHTML = "<p style='color:#16a34a;font-weight:bold;font-size:20px'>🎉 Бүгдийг зөв бодлоо!</p>";
        }
      }

      haruul();
    </script>
  </body>
</html>
